services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - default
      - ollama-shared
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORIA:-8g}
          cpus: "${OLLAMA_CPUS:-2}"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openhands:
    image: ghcr.io/openhands/agent-canvas:latest
    restart: unless-stopped
    environment:
      PORT: "8000"
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?Configure uma chave forte}
      OH_SECRET_KEY: ${OH_SECRET_KEY:?Configure uma chave forte}
      AGENT_CANVAS_DISABLE_TELEMETRY: "true"
    expose:
      - "8000"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - openhands-projects:/projects
    networks:
      - dokploy-network
      - ollama-shared
    depends_on:
      ollama:
        condition: service_healthy

networks:
  dokploy-network:
    external: true
  ollama-shared:
    name: ollama-shared

volumes:
  openhands-data:
  openhands-projects:
  ollama-data:
