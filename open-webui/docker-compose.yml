# Ollama na GPU, num projeto Compose independente do validador (não reinicia a cada deploy dele).
# Cria a rede ollama-shared, pela qual o validador e outros projetos acessam http://ollama:11434.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - default
      - ollama-shared
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORIA:-8g}
          cpus: "${OLLAMA_CPUS:-2}"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ollama-shared:
    name: ollama-shared

volumes:
  ollama-data:
