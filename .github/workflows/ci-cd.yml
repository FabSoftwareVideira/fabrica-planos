# Testes em todo push/PR; a cada push na master que passe nos testes, pede ao Dokploy (pela API) o deploy
# do recurso do validador. O Dokploy baixa o código, reconstrói e sobe os containers no servidor
# (ver "Deploy automático" no README). O deploy automático do próprio Dokploy fica desligado, para que só
# código testado vá para o ar.
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  # Botão "Run workflow" na aba Actions, para reimplantar sem novo commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planos
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: planos_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planos -d planos_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # a mesma do Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Os testes de backup usam pg_dump e psql; o cliente deve acompanhar o servidor PostgreSQL 17.
      - name: Instalar cliente PostgreSQL
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/postgresql.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/postgresql.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://planos:teste@localhost:5432/planos_teste

      # Vulnerabilidades conhecidas nas dependências Python: falha aqui e o deploy não acontece
      - name: Auditar dependências
        run: pip install pip-audit && pip-audit -r requirements.txt

      # Garante que a imagem de produção ainda constrói antes de chegar ao servidor
      - run: docker build --target producao -t validador-planos:ci .

      # E que os Compose de produção, desenvolvimento e do Ollama continuam válidos
      - run: docker compose -f docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: teste
      - run: docker compose -f docker-compose.dev.yml config --quiet
      - run: docker compose -f open-webui/docker-compose.yml config --quiet

  deploy:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Um deploy por vez; um novo push espera o anterior terminar em vez de cancelá-lo no meio
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      # Em Settings > Secrets and variables > Actions: DOKPLOY_URL (endereço do painel, com https),
      # DOKPLOY_API_KEY (gerada no perfil do Dokploy) e DOKPLOY_COMPOSE_ID (id do recurso, na URL dele).
      - name: Pedir o deploy ao Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          for v in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            [ -n "${!v}" ] || { echo "::error::Defina o secret $v."; exit 1; }
          done
          curl --fail-with-body --silent --show-error -X POST "${DOKPLOY_URL%/}/api/compose.deploy"             -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json'             -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
          echo "Deploy pedido. Acompanhe o build e os logs na aba Deployments do recurso no Dokploy."
