services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.5
    restart: "no"
    ports:
      - "${N8N_PORT}:${N8N_PORT}"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - TZ=${TZ}
      # Code node com retentativas ao Ollama pode passar de 300s por bloco
      - N8N_RUNNERS_TASK_TIMEOUT=1800
      # Libera os nós Read/Write Files a ler e gravar em /data (planos e resultados)
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      # PDFs de entrada (leitura) e CSV de saída, pastas locais do Windows
      - "./planos:/data/planos:ro"
      - "./resultados:/data/resultados"
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    networks:
      - tc-network

  # Importa (ou atualiza, pelo id fixo) o workflow e o ativa antes do n8n subir
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.45.5
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "n8n import:workflow --input=/workflows/validacao-planos.json && n8n publish:workflow --id=ValidacaoPlanos1"
    volumes:
      - n8n_data:/home/node/.n8n
      - "./workflows/validacao-planos.json:/workflows/validacao-planos.json:ro"
    networks:
      - tc-network

  ollama:
    image: ollama/ollama
    restart: "no"
    ports:
      # Porta do host (OLLAMA_PORT) -> porta interna 11434, que os workflows usam em http://ollama:11434
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      # Cache KV menor: qwen2.5:7b + ctx 8192 cabe na GPU de 6 GB (~30% mais rápido medido)
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    networks:
      - tc-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  n8n_data:
  ollama_data:

networks:
  tc-network:
    driver: bridge
