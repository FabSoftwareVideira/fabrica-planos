# Produção no Dokploy (recurso do tipo Docker Compose): app com gunicorn atrás do Caddy interno e do
# oauth2-proxy (login com Google). O domínio e o HTTPS ficam com o Traefik do Dokploy,
# configurados na tela do Dokploy para o serviço caddy (porta 80). As variáveis vêm da aba Environment
# (modelo em .env.example). Para desenvolver na sua máquina, use docker-compose.dev.yml.
# Limites de hardware: cada serviço tem teto de memória e de CPU (ajustáveis pelas variáveis *_MEMORIA e
# *_CPUS), para que um não derrube os outros projetos da VPS. Passar do teto de memória reinicia só aquele
# container. O número de CPUs não pode passar do que a máquina tem (o Docker recusa).
services:
  preparar-pastas:
    # Roda a cada deploy, antes do app, e termina: passa as pastas de dados do servidor para o usuário do app
    # (UID 10001, ver Dockerfile). Assim uma VPS nova (o Docker cria as pastas que faltam como root) e arquivos
    # copiados com outro dono (backup, cp -a) não precisam de chown manual.
    image: busybox:1.36
    restart: "no"
    command:
      [
        "chown",
        "-R",
        "10001:10001",
        "/data/planos",
        "/data/resultados",
        "/data/backups",
      ]
    volumes:
      - "${PLANOS_HOST_DIR:-/srv/validador-planos/planos}:/data/planos"
      - "${RESULTADOS_HOST_DIR:-/srv/validador-planos/resultados}:/data/resultados"
      - "${BACKUPS_HOST_DIR:-/srv/validador-planos/backups}:/data/backups"
    network_mode: none
    # Só as capacidades de trocar o dono e de percorrer pastas de outro dono
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH

  fabrica-planos-db:
    # Usuários e revisões. Só o app o alcança (rede interna do compose, sem "ports"). Os dados ficam no volume
    # pgdata; o backup do app (pg_dump dentro do ZIP) é a cópia de segurança.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=planos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      - POSTGRES_DB=planos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planos -d planos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORIA:-512m}
          cpus: "${POSTGRES_CPUS:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fabrica-planos-app:
    build:
      context: .
      target: producao
    restart: unless-stopped
    # Sem "ports" e fora da rede do Dokploy: só o caddy (login) alcança o app e repassa o e-mail de quem
    # entrou; só os e-mails de ADMIN_EMAILS enviam/excluem PDFs e disparam validações.
    networks:
      default:
        aliases:
          - fabrica-planos-web-interno
      ollama-shared:
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama do projeto Open WebUI, alcançado pela rede Docker compartilhada
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - AGENDAMENTO_HORA=${AGENDAMENTO_HORA}
      - PDF_MAX_MB=${PDF_MAX_MB:-10}
      - DATABASE_URL=postgresql://planos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@postgres:5432/planos
      - AGENDAR=1
      # Backup diário de todos os dados (ver README, "Backup e restauração")
      - BACKUPS_DIR=/data/backups
      - BACKUP_HORA=${BACKUP_HORA:-3}
      - BACKUP_MANTER=${BACKUP_MANTER:-7}
      - BACKUP_AGENDAR=${BACKUP_AGENDAR:-1}
      - EXIGIR_LOGIN=1
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - EMAIL_DOMINIO=${EMAIL_DOMINIO:-ifc.edu.br}
      # Login com gov.br (rotas/govbr.py): ligado quando há cliente, segredo e SEGREDO_SESSAO. O app também
      # responde ao Caddy se há sessão (/auth/verificar), conferindo a do Google no oauth2-proxy.
      - GOVBR_CLIENT_ID=${GOVBR_CLIENT_ID:-}
      - GOVBR_CLIENT_SECRET=${GOVBR_CLIENT_SECRET:-}
      - GOVBR_AMBIENTE=${GOVBR_AMBIENTE:-producao}
      - GOVBR_REDIRECT_URI=${GOVBR_REDIRECT_URI:-}
      - GOVBR_LOGOUT_URI=${GOVBR_LOGOUT_URI:-}
      - SEGREDO_SESSAO=${SEGREDO_SESSAO:-}
      - LOGIN_GOOGLE=${LOGIN_GOOGLE:-1}
      # Assinatura dos planos pela API do gov.br (servicos/assinatura_api.py): credenciais próprias, separadas
      # das do login. O ambiente segue GOVBR_AMBIENTE se GOVBR_ASSINATURA_AMBIENTE não for dado.
      - GOVBR_ASSINATURA_CLIENT_ID=${GOVBR_ASSINATURA_CLIENT_ID:-}
      - GOVBR_ASSINATURA_CLIENT_SECRET=${GOVBR_ASSINATURA_CLIENT_SECRET:-}
      - GOVBR_ASSINATURA_AMBIENTE=${GOVBR_ASSINATURA_AMBIENTE:-}
      - GOVBR_ASSINATURA_REDIRECT_URI=${GOVBR_ASSINATURA_REDIRECT_URI:-}
      - GOVBR_ASSINATURA_OAUTH_URL=${GOVBR_ASSINATURA_OAUTH_URL:-}
      - GOVBR_ASSINATURA_API_URL=${GOVBR_ASSINATURA_API_URL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TZ=${TZ}
    volumes:
      # Pastas fixas do servidor, fora do código: o Dokploy clona o repositório de novo a cada deploy, e
      # uma pasta relativa a ele (./resultados) seria perdida. Planos gravável: o dashboard envia e exclui PDFs.
      - "${PLANOS_HOST_DIR:-/srv/validador-planos/planos}:/data/planos"
      - "${RESULTADOS_HOST_DIR:-/srv/validador-planos/resultados}:/data/resultados"
      # Backups num volume próprio, fora de resultados (para uma restauração não apagar os backups)
      - "${BACKUPS_HOST_DIR:-/srv/validador-planos/backups}:/data/backups"
    depends_on:
      preparar-pastas:
        condition: service_completed_successfully
      fabrica-planos-db:
        condition: service_healthy
    # Saudável quando o gunicorn responde /health (a imagem não tem curl: usa o Python dela)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Sem ganhar privilégios depois de iniciar (setuid) e sem as capacidades de root que não usa
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Extrair o texto de 23 planos reais chegou a 340 MB; o teto deixa folga para um envio e uma validação ao mesmo tempo
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORIA:-1500m}
          cpus: "${APP_CPUS:-1.5}"
          pids: 256
    # Logs do Docker giram em até 3 arquivos de 10 MB (sem isso crescem até encher o disco)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fabrica-planos-caddy:
    # Porta de entrada: o Traefik do Dokploy repassa o domínio para cá (porta 80, na rede dokploy-network).
    # Sem "ports" no host; o HTTPS é do Traefik.
    image: caddy:2
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - dokploy-network
    # Pelo próprio Caddy até o app: confere a porta de entrada e o repasse ao app de uma vez
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      # Só recebe tráfego depois que o app está de pé
      fabrica-planos-app:
        condition: service_healthy
      fabrica-planos-oauth2-proxy:
        condition: service_started
    # Sem ganhar privilégios depois de iniciar (setuid) e sem as capacidades de root que não usa
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # escutar na porta 80
    # Só repassa requisições: bem menos que isto
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
          pids: 128
    # Logs do Docker giram em até 3 arquivos de 10 MB (sem isso crescem até encher o disco)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fabrica-planos-oauth2-proxy:
    # Login com Google; só aceita contas @ifc.edu.br (alunos usam @estudantes.ifc.edu.br e ficam de fora)
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=${EMAIL_DOMINIO:-ifc.edu.br}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      # Responde ao forward_auth do Caddy (/oauth2/auth) com o e-mail em X-Auth-Request-Email
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      # ID token (com o nome da conta) no cabeçalho Authorization da resposta de /oauth2/auth; o Caddy o repassa ao app
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      # Atrás do Caddy: monta o endereço de retorno do Google a partir do host pedido
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_COOKIE_SECURE=${COOKIE_SECURE:-true}
      - OAUTH2_PROXY_COOKIE_NAME=_planos_login
      # Um cookie CSRF por tentativa de login: duas abas fazendo login ao mesmo tempo não se atrapalham
      - OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST=true
      - OAUTH2_PROXY_COOKIE_CSRF_EXPIRE=15m
      # Cookie de login não vai em envios vindos de outros sites (proteção contra CSRF)
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
    # Sem ganhar privilégios depois de iniciar (setuid) e sem as capacidades de root que não usa
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Só confere a sessão de login a cada requisição
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64
    # Logs do Docker giram em até 3 arquivos de 10 MB (sem isso crescem até encher o disco)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Rede do Traefik do Dokploy (criada na instalação do Dokploy)
  dokploy-network:
    external: true
  ollama-shared:
    name: ollama-shared
    external: true

volumes:
  pgdata:
