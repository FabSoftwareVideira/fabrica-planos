# Desenvolvimento na sua máquina: só o app, sem Caddy nem Google (login simulado em /dev/login, para
# entrar como pessoas e perfis diferentes), com recarga automática.
#   docker compose -f docker-compose.dev.yml up --build        → http://localhost:8000
#   docker compose -f docker-compose.dev.yml --profile ia up      → também o Ollama, na GPU NVIDIA
#   docker compose -f docker-compose.dev.yml --profile ia-cpu up  → também o Ollama, na CPU (sem GPU)
# Projeto separado (validador-planos-dev): não mexe nos containers nem nos volumes de produção.
# Não precisa de .env; dá para ajustar com as variáveis DEV_* (ver README, "Rodar em desenvolvimento").
name: validador-planos-dev

services:
  app:
    build:
      context: .
      target: desenvolvimento
    ports:
      # Só a sua máquina acessa (o modo debug do Flask não deve ficar exposto na rede)
      - "127.0.0.1:${DEV_PORT:-8000}:8000"
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama dos perfis "ia"/"ia-cpu" abaixo, ou outro: o do host (http://host.docker.internal:11434)
      # ou o do servidor por um túnel SSH (ssh -L 11434:localhost:PORTA ...) também no host
      - OLLAMA_URL=${DEV_OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${DEV_OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_NUM_CTX=${DEV_OLLAMA_NUM_CTX:-8192}
      - PDF_MAX_MB=10
      - DATABASE_URL=postgresql://planos:${DEV_POSTGRES_PASSWORD:-planos}@postgres:5432/planos
      # Login simulado: em vez do Google, escolhe-se uma persona (administração, coordenação, NDE, NDB,
      # professor) ou qualquer e-mail em /dev/login. Com DEV_EXIGIR_LOGIN=0, sem login nenhum: todo
      # acesso conta como administrador.
      - EXIGIR_LOGIN=${DEV_EXIGIR_LOGIN:-1}
      - LOGIN_SIMULADO=1
      - ADMIN_EMAILS=${DEV_ADMIN_EMAILS:-admin@ifc.edu.br}
      - EMAIL_DOMINIO=ifc.edu.br
      # Assinatura pela API do gov.br simulada: "Assinar com gov.br" assina com uma AC de teste local, sem ir
      # ao gov.br (só vale junto do login simulado). Vazio desliga o botão.
      - GOVBR_ASSINATURA_AMBIENTE=${DEV_ASSINATURA_AMBIENTE-simulada}
      # Cookies sem "Secure": o dev roda em http
      - COOKIE_SECURE=false
      # Sem validação nem backup diário automático (os backups podem ser feitos pela administração)
      - AGENDAR=0
      - BACKUPS_DIR=/data/backups
      - BACKUP_AGENDAR=0
      - TZ=America/Sao_Paulo
    volumes:
      # Código do host: o Flask recarrega a cada arquivo salvo
      - .:/app
      # PDFs: por padrão os da pasta planos/ do repositório (fora do git)
      - "${DEV_PLANOS_DIR:-./planos}:/data/planos"
      # Resultados, usuários e revisões de desenvolvimento, separados dos de produção
      - ./dev-resultados:/data/resultados
      # Backups de desenvolvimento, fora do git
      - ./dev-backups:/data/backups
    extra_hosts:
      # host.docker.internal também no Linux (no Windows e no macOS ele já existe)
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL do desenvolvimento: usuários e revisões. Dados no volume validador-planos-dev_pgdata;
  # a porta fica só no seu computador, para conectar com psql ou DBeaver (DEV_POSTGRES_PORT).
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=planos
      - POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD:-planos}
      - POSTGRES_DB=planos
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planos -d planos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ollama na GPU NVIDIA (precisa do Docker com suporte a GPU: Docker Desktop + driver NVIDIA no Windows,
  # ou o NVIDIA Container Toolkit no Linux).
  ollama:
    image: ollama/ollama:latest
    profiles: [ia]
    ports:
      - "127.0.0.1:${DEV_OLLAMA_PORT:-11434}:11434"
    volumes:
      - modelos:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # O mesmo Ollama na CPU, para quem não tem GPU NVIDIA (lento, mas serve para testar a validação).
  # Atende pelo mesmo nome (ollama) na rede do compose. Use um perfil ou o outro, não os dois.
  ollama-cpu:
    image: ollama/ollama:latest
    profiles: [ia-cpu]
    ports:
      - "127.0.0.1:${DEV_OLLAMA_PORT:-11434}:11434"
    volumes:
      - modelos:/root/.ollama
    networks:
      default:
        aliases: [ollama]

volumes:
  pgdata:
  # Modelos baixados: por padrão o mesmo volume do docker-compose.yml (validador-planos_ollama-data),
  # para não baixar de novo os ~5 GB do qwen2.5:7b se a produção já rodou nesta máquina.
  modelos:
    name: ${DEV_OLLAMA_VOLUME:-validador-planos_ollama-data}
