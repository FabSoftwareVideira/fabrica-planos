services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8000"
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama externo (outro container ou serviço), alcançado pela porta publicada no host
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - AGENDAMENTO_HORA=${AGENDAMENTO_HORA}
      - AGENDAR=1
      - TZ=${TZ}
    extra_hosts:
      # Em Linux, host.docker.internal só existe com esse mapeamento
      - "host.docker.internal:host-gateway"
    volumes:
      # PDFs de entrada (somente leitura) ficam fora do container, na pasta indicada em PLANOS_HOST_DIR
      - "${PLANOS_HOST_DIR}:/data/planos:ro"
      - "./resultados:/data/resultados"
