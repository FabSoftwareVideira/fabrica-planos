services:
  app:
    build: .
    restart: unless-stopped
    # Sem "ports": o acesso de fora passa pelo serviço caddy (HTTPS e login), que repassa o e-mail
    # de quem entrou; só os e-mails de ADMIN_EMAILS enviam/excluem PDFs e disparam validações.
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama do serviço abaixo, alcançado pelo nome do serviço na rede do compose
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - AGENDAMENTO_HORA=${AGENDAMENTO_HORA}
      - PDF_MAX_MB=${PDF_MAX_MB:-10}
      - HISTORICO_MAX=${HISTORICO_MAX:-3}
      - AGENDAR=1
      - EXIGIR_LOGIN=1
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - TZ=${TZ}
    volumes:
      # PDFs de entrada ficam fora do container, na pasta indicada em PLANOS_HOST_DIR.
      # Gravável porque o dashboard envia e exclui PDFs.
      - "${PLANOS_HOST_DIR}:/data/planos"
      - "./resultados:/data/resultados"
    depends_on:
      ollama:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # 80 é usada pelo Let's Encrypt para emitir e renovar o certificado
      - "80:80"
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_HOST=${APP_HOST:-}
      - APP_PORT=${APP_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados persistem entre recriações do container
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - oauth2-proxy

  oauth2-proxy:
    # Login com Google; só aceita contas @ifc.edu.br (alunos usam @estudantes.ifc.edu.br e ficam de fora)
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=${EMAIL_DOMINIO:-ifc.edu.br}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      # Responde ao forward_auth do Caddy (/oauth2/auth) com o e-mail em X-Auth-Request-Email
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      # Atrás do Caddy: monta o endereço de retorno do Google a partir do host pedido
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_COOKIE_SECURE=${COOKIE_SECURE:-true}
      - OAUTH2_PROXY_COOKIE_NAME=_planos_login
      # Um cookie CSRF por tentativa de login: duas abas fazendo login ao mesmo tempo não se atrapalham
      - OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST=true
      - OAUTH2_PROXY_COOKIE_CSRF_EXPIRE=15m

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Acesso ao Ollama pelo host; o app usa a rede interna e não depende desta porta.
      # Por padrão só aceita conexões da própria máquina (o Ollama não tem autenticação).
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      - TZ=${TZ}
    volumes:
      # Modelos baixados persistem entre recriações do container
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
  caddy-data:
  caddy-config:
