services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8000"
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama do serviço abaixo, alcançado pelo nome do serviço na rede do compose
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - AGENDAMENTO_HORA=${AGENDAMENTO_HORA}
      - AGENDAR=1
      - TZ=${TZ}
    volumes:
      # PDFs de entrada (somente leitura) ficam fora do container, na pasta indicada em PLANOS_HOST_DIR
      - "${PLANOS_HOST_DIR}:/data/planos:ro"
      - "./resultados:/data/resultados"
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Modelos baixados persistem entre recriações do container
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
