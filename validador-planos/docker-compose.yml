services:
  app:
    build: .
    restart: unless-stopped
    # Sem "ports": o acesso de fora passa pelo serviço caddy (HTTPS e senha).
    environment:
      - PLANOS_DIR=/data/planos
      - RESULTADOS_DIR=/data/resultados
      # Ollama do serviço abaixo, alcançado pelo nome do serviço na rede do compose
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
      - AGENDAMENTO_HORA=${AGENDAMENTO_HORA}
      - PDF_MAX_MB=${PDF_MAX_MB:-10}
      - HISTORICO_MAX=${HISTORICO_MAX:-3}
      - AGENDAR=1
      - TZ=${TZ}
    volumes:
      # PDFs de entrada ficam fora do container, na pasta indicada em PLANOS_HOST_DIR.
      # Gravável porque o dashboard envia e exclui PDFs.
      - "${PLANOS_HOST_DIR}:/data/planos"
      - "./resultados:/data/resultados"
    depends_on:
      ollama:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # 80 é usada pelo Let's Encrypt para emitir e renovar o certificado
      - "80:80"
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_HOST=${APP_HOST:-}
      - APP_PORT=${APP_PORT}
      - APP_USUARIO=${APP_USUARIO}
      - APP_SENHA_HASH=${APP_SENHA_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados persistem entre recriações do container
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Acesso ao Ollama pelo host; o app usa a rede interna e não depende desta porta.
      # Por padrão só aceita conexões da própria máquina (o Ollama não tem autenticação).
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      - TZ=${TZ}
    volumes:
      # Modelos baixados persistem entre recriações do container
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
  caddy-data:
  caddy-config:
