{#- Peças usadas por mais de uma página. -#}

{# Selo colorido com o status (OK, INCOMPLETO, AUSENTE...). #}
{% macro selo(status) -%}
<span style="background:{{ cor(status) }};color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap">{{ status or '-' }}</span>
{%- endmacro %}
